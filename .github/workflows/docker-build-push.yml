name: Test and publish BaseStar downhole images
on:
  workflow_dispatch:
    inputs:
      common_ref:
        description: Full D-WIS/Common commit SHA containing the downhole contract and runtime
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: DAQBridgeBaseStar
      - uses: actions/checkout@v4
        with:
          repository: D-WIS/Common
          ref: ${{ inputs.common_ref }}
          path: Common
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify pinned shared source
        shell: bash
        env:
          COMMON_REF: ${{ inputs.common_ref }}
        run: |
          [[ "$COMMON_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C Common rev-parse HEAD)" = "$COMMON_REF"
      - run: dotnet build DAQBridgeBaseStar/DWIS.DAQBridge.BaseStar.sln -c Release
      - run: dotnet test DAQBridgeBaseStar/DWIS.DAQBridge.BaseStar.sln -c Release --no-build
      - run: dotnet test Common/DWIS.RigOS.DownholeMechanical.Tests/DWIS.RigOS.DownholeMechanical.Tests.csproj -c Release --filter 'TestCategory!=Integration'
  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [Server, OPCUASource, BlackboardSink]
    steps:
      - uses: actions/checkout@v4
        with:
          path: DAQBridgeBaseStar
      - uses: actions/checkout@v4
        with:
          repository: D-WIS/Common
          ref: ${{ inputs.common_ref }}
          path: Common
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Image name
        id: image
        shell: bash
        run: echo "name=digiwells/dwisdaqbridgebasestar$(echo '${{ matrix.role }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: DAQBridgeBaseStar/DWIS.DAQBridge.BaseStar.${{ matrix.role }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:stable
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-common-${{ inputs.common_ref }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            no.dwis.common.revision=${{ inputs.common_ref }}
