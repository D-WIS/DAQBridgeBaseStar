name: Test and publish BaseStar downhole images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build DWIS.DAQBridge.BaseStar.sln -c Release
      - run: dotnet test DWIS.DAQBridge.BaseStar.sln -c Release --no-build
      - name: Validate provider configuration
        env:
          DWIS_CONFIG_PATH: config/downhole.config.example.json
        run: dotnet run --project DWIS.DAQBridge.BaseStar.Server/DWIS.DAQBridge.BaseStar.Server.csproj -c Release --no-build -- --validate-config
      - name: Verify packaged OPC-UA configuration assets
        shell: pwsh
        run: |
          foreach ($role in @('Server', 'OPCUASource', 'BlackboardSink')) {
            $asset = "DWIS.DAQBridge.BaseStar.$role/bin/Release/net8.0/config/Quickstarts.ReferenceClient.Config.xml"
            if (-not (Test-Path $asset)) { throw "Missing packaged runtime configuration: $asset" }
          }
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [Server, OPCUASource, BlackboardSink]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Image name
        id: image
        shell: bash
        run: echo "name=digiwells/dwisdaqbridgebasestar$(echo '${{ matrix.role }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: DWIS.DAQBridge.BaseStar.${{ matrix.role }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:stable
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
