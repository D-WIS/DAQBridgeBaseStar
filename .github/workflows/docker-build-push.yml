name: Test and publish BaseStar Docker images

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore ./DWIS.DAQBridge.BaseStar.sln
      - run: dotnet build ./DWIS.DAQBridge.BaseStar.sln -c Release --no-restore
      - run: dotnet test ./DWIS.DAQBridge.BaseStar.sln -c Release --no-build --no-restore

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Server
            dockerfile: DWIS.DAQBridge.BaseStar.Server/Dockerfile
            image: digiwells/dwisdaqbridgebasestarserver
          - name: OPC-UA Source
            dockerfile: DWIS.DAQBridge.BaseStar.OPCUASource/Dockerfile
            image: digiwells/dwisdaqbridgebasestaropcuasource
    name: Publish ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=stable
            type=sha,prefix=sha-,format=long
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
